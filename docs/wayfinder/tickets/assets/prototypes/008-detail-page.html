/* ---------------------------------------------------------------------------
   PROTOTYPE — throwaway. Ticket 008, "The project detail page".
   Four structurally different arrangements of one programme, switchable with
   ?variant=A|B|C|D. Also ?p=20k|tender, ?fields=1 (provenance), ?theme=dark.

   WHAT IS REAL: derived.json is the genuine article, computed by
   tools/fixture-gen/measure.mjs from fixtures/generated/perf-20k.xer — 20,000
   activities, 34,000 relationships, 1,800 WBS nodes, a real CPM pass. Every
   chart, every stat and every DCMA verdict below is that file's own numbers.
   The WBS tree is the real one (parent + name arrays, codes regenerated).
   WHAT IS NOT: the 20,000 individual activity rows are synthesised in the
   browser to match the real histograms (status mix, float, duration, finishes
   per month, activities per WBS node) — inlining 3 MB of real rows into a docs
   asset was not worth it. Row *shapes* are real; row *strings* are not.

:root {

  --surface:    #fcfcfb;

  --ink:        #0b0b0b;

  --muted:      #898781;
  --grid:       #e1e0d9;
  --axis:       #c3c2b7;
  --hair:       rgba(11,11,11,0.10);
  --series:     #2a78d6;
  --series-100: #cde2fb;
  --series-250: #86b6ef;
  --series-700: #1c5296;
  --neg:        #d03b3b;
  --neg-100:    #f7dcdc;
  --slack:      #eda100;
  --slack-100:  #fbeccb;
  --good:       #0ca30c;
  --warn:       #fab219;
  --chip:       rgba(11,11,11,0.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane: #0d0d0d; --surface: #1a1a19; --sunk: #131312;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --hair: rgba(255,255,255,0.10);
    --series: #3987e5; --series-100: #184f95; --series-250: #256abf; --series-700: #9cc6f4;
    --neg: #d03b3b; --neg-100: #5c1f1f; --slack: #c98500; --slack-100: #4d3305;
    --good: #0ca30c; --warn: #fab219; --chip: rgba(255,255,255,0.07);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d; --surface: #1a1a19; --sunk: #131312;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --hair: rgba(255,255,255,0.10);
  --series: #3987e5; --series-100: #184f95; --series-250: #256abf; --series-700: #9cc6f4;
  --neg: #d03b3b; --neg-100: #5c1f1f; --slack: #c98500; --slack-100: #4d3305;
  --good: #0ca30c; --warn: #fab219; --chip: rgba(255,255,255,0.07);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--plane); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
body.scrolls { padding-bottom: 96px; }
a { color: inherit; }
.wrap { max-width: 1360px; margin: 0 auto; padding: 20px 20px 0; }
.num { font-variant-numeric: tabular-nums; }
.mut { color: var(--muted); }
.ink2 { color: var(--ink-2); }
h2.sec {
  font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); margin: 30px 0 10px; font-weight: 600;
}
.card { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; }
.pad { padding: 14px 16px; }

/* ---- identity ----------------------------------------------------------- */
.crumb { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.crumb a { text-decoration: none; }
.crumb a:hover { text-decoration: underline; }
.idrow { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
.idrow .grow { flex: 1 1 420px; min-width: 0; }
h1 { font-size: 23px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -0.015em; }
.byline { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
  padding: 2px 7px; border-radius: 4px; background: var(--chip); color: var(--ink-2); white-space: nowrap;
}
.badge.ghost { background: none; border: 1px solid var(--hair); color: var(--muted); }
.badge.warn { color: var(--warn); }
.dot { color: var(--axis); padding: 0 .4em; }

/* ---- actions ------------------------------------------------------------ */
.acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn {
  font: inherit; font-size: 13px; cursor: pointer; border-radius: 7px;
  border: 1px solid var(--hair); background: var(--surface); color: var(--ink);
  padding: 7px 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { border-color: var(--axis); }
.btn.primary { background: var(--ink); color: var(--plane); border-color: var(--ink); font-weight: 500; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn .sz { color: var(--muted); font-size: 11.5px; }
.btn.primary .sz { color: var(--axis); }
.vote { border-radius: 999px; padding: 6px 12px 6px 10px; }
.vote.voted { border-color: var(--series); color: var(--series); background: var(--series-100); }
select.rev { font: inherit; font-size: 12.5px; padding: 5px 8px; border-radius: 6px;
  border: 1px solid var(--hair); background: var(--surface); color: var(--ink); }

/* ---- fact tiles --------------------------------------------------------- */
.tiles { display: grid; gap: 1px; background: var(--hair); border: 1px solid var(--hair); border-radius: 10px; overflow: hidden; }
.tiles.c8 { grid-template-columns: repeat(8, 1fr); }
.tiles.c4 { grid-template-columns: repeat(4, 1fr); }
.tile { background: var(--surface); padding: 10px 12px; min-width: 0; }
.tile .lab { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .val { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; margin-top: 1px; }
.tile .val small { font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.tile .sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.hero { font-size: 52px; font-weight: 650; letter-spacing: -0.03em; line-height: 1; }
.hero small { font-size: 20px; color: var(--muted); font-weight: 400; letter-spacing: -0.01em; }

/* ---- charts ------------------------------------------------------------- */
.chartbox { position: relative; }
.chartbox .ttl { font-size: 13px; font-weight: 600; }
.chartbox .sub { font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
.tip {
  position: absolute; pointer-events: none; z-index: 20; background: var(--ink); color: var(--plane);
  font-size: 11.5px; padding: 5px 8px; border-radius: 6px; white-space: nowrap; opacity: 0;
  transition: opacity .08s; transform: translate(-50%, -120%); box-shadow: 0 4px 14px rgba(0,0,0,.25);
}
.tip.on { opacity: 1; }
.tip .k { color: var(--axis); }
.axlab { font-size: 10.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.bandkey { display: flex; gap: 14px; font-size: 11px; color: var(--ink-2); margin-top: 6px; flex-wrap: wrap; }
.bandkey i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.callout {
  font-size: 12px; color: var(--ink-2); background: var(--sunk); border-radius: 7px;
  padding: 8px 10px; margin-top: 10px; border-left: 3px solid var(--axis);
}
.callout b { color: var(--ink); }

/* ---- DCMA --------------------------------------------------------------- */
.cells { display: inline-flex; gap: 2px; vertical-align: -1px; }
.cell { width: 7px; height: 12px; border-radius: 1px; background: var(--grid); }
.cell.pass { background: var(--good); }
.cell.fail { background: var(--neg); }
.cell.skip { background: none; border: 1px dashed var(--axis); }
.checks { display: flex; flex-direction: column; }
.chk {
  display: grid; grid-template-columns: 22px 20px 1fr 96px 92px 18px; gap: 10px; align-items: center;
  padding: 9px 4px; border-top: 1px solid var(--hair); cursor: pointer; font-size: 13px;
}
.chk:first-child { border-top: 0; }
.chk:hover { background: var(--chip); }
.chk .mark { font-size: 13px; font-weight: 700; text-align: center; }
.chk .mark.pass { color: var(--good); }
.chk .mark.fail { color: var(--neg); }
.chk .mark.skip { color: var(--muted); font-weight: 400; }
.chk .n { color: var(--muted); font-size: 11.5px; text-align: right; }
.chk .state { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.chk .val { text-align: right; font-variant-numeric: tabular-nums; }
.chk .val b { font-weight: 600; }
.chk .thr { text-align: right; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chk .caret { color: var(--axis); font-size: 10px; text-align: center; }
/* the value cell carries the number the threshold is about, and under it the
   count and the population it came out of — a percentage with no denominator
   is the thing planners complain about most in a scorecard */
.chk .val small { display: block; font-size: 10.5px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
/* value against threshold, drawn. never colour-only: the margin sentence beside
   it says the same thing in words and numbers (008, deuteranopia ΔE 4.1) */
.chkbar { display: grid; grid-template-columns: 132px 1fr; gap: 9px; align-items: center; margin-top: 6px; max-width: 560px; }
.chkbar .track { position: relative; height: 6px; border-radius: 3px; background: var(--chip); border: 1px solid var(--hair); }
.chkbar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px 0 0 3px; }
.chkbar .fill.pass { background: var(--good); }
.chkbar .fill.fail { background: var(--neg); }
.chkbar .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.chkbar .tick i { position: absolute; top: -13px; left: 50%; transform: translateX(-50%);
  font-size: 9.5px; font-style: normal; color: var(--ink-2); white-space: nowrap; }
.chkbar .margin { font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chkbar .margin b { color: var(--ink); font-weight: 600; }
.exemplars table thead td { font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted); padding-bottom: 3px; }
.exemplars table thead td.v { color: var(--muted); }
.exemplars .scroll { max-height: 232px; overflow-y: auto; }
.chk.skipped { opacity: .62; cursor: default; }
.exemplars { background: var(--sunk); border-radius: 8px; margin: 0 4px 8px; padding: 10px 12px; font-size: 12px; }
.exemplars table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.exemplars td { padding: 3px 6px 3px 0; border-bottom: 1px solid var(--hair); }
.exemplars td.v { text-align: right; color: var(--neg); white-space: nowrap; }
.exemplars .more { margin-top: 8px; color: var(--ink-2); }
.exemplars .more a { color: var(--series); }

/* ---- WBS tree ----------------------------------------------------------- */
.tree { font-size: 12.5px; overflow: auto; }
.tnode { display: grid; grid-template-columns: 14px 1fr auto; gap: 6px; align-items: center;
  padding: 3px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
.tnode:hover { background: var(--chip); }
.tnode.on { background: var(--series-100); color: var(--series-700); }

.tnode .tn { overflow: hidden; text-overflow: ellipsis; }
.tnode .tc { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tnode.on .tc { color: var(--series-700); }

.grid-head, .grid-row {

  gap: 10px; padding: 0 12px; align-items: center;

.mile { color: var(--ink-2); }

.drawer .db { padding: 4px 18px 18px; display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 20px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--hair); margin-top: 16px; }

.tab:hover { color: var(--ink); }

.tab.on .c { color: var(--ink-2); }
.tabnote { font-size: 11.5px; color: var(--muted); padding: 8px 2px 0; }

body.fields [data-src] { outline: 1px dashed transparent; outline-offset: 1px; }
body.fields [data-src="col"]  { outline-color: var(--series); }

body.fields [data-src="api"]  { outline-color: var(--good); }
.legend-src { display: flex; gap: 16px; font-size: 11px; color: var(--muted); margin: 10px 0; flex-wrap: wrap; }
.legend-src i { display: inline-block; width: 10px; height: 10px; border: 1px dashed; margin-right: 4px; vertical-align: -1px; }

/* ---- switcher ------------------------------------------------------------ */
#switcher {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px; z-index: 90;
  background: var(--ink); color: var(--plane); border-radius: 999px; padding: 5px 7px;
  box-shadow: 0 6px 24px rgba(0,0,0,.3); font-size: 12.5px;
}
#switcher button { font: inherit; cursor: pointer; border: 0; border-radius: 999px;
  background: transparent; color: inherit; padding: 4px 9px; }
#switcher button:hover { background: rgba(128,128,128,.35); }
#switcher .on { background: rgba(128,128,128,.45); }
#switcher .lab { padding: 0 8px; white-space: nowrap; font-weight: 500; }
#switcher .sep { width: 1px; align-self: stretch; background: rgba(128,128,128,.4); margin: 2px 3px; }
</style>

/* WBS codes are regenerated from the real parent array. */
function buildWbs() {
  const nodes = WBS_PARENT.map((p,i) => ({ i, p, name: WBS_VOCAB[WBS_NAME[i]], n: WBS_COUNT[i], kids: [], depth: 0, code: "" }));
  nodes.forEach(n => { if (n.p >= 0) nodes[n.p].kids.push(n); });
  const walk = (n, prefix, seq) => {
    n.code = n.p < 0 ? "PRJ" : `${prefix}.${seq}`;
    n.depth = n.p < 0 ? 1 : nodes[n.p].depth + 1;
    n.kids.forEach((k,i) => walk(k, n.code, i+1));
  };
  walk(nodes[0], "", 0);
  // roll activity counts up the tree
  const roll = n => { n.total = n.n + n.kids.reduce((s,k) => s + roll(k), 0); return n.total; };
  roll(nodes[0]);
  return nodes;
}

/* Sample a value inside a histogram bucket, so the synthesised rows reproduce
   the real distribution the charts are drawn from. */
function bucketSampler(counts, edges, lowOpen, highOpen, rnd) {
  const pool = [];
  counts.forEach((c,i) => { if (c) pool.push([i,c]); });
  const total = counts.reduce((a,b)=>a+b,0);
  return () => {
    let r = rnd() * total;
    for (const [i,c] of pool) { if ((r -= c) < 0) {
      const lo = i === 0 ? lowOpen : edges[i-1];
      const hi = i === counts.length-1 ? highOpen : edges[i];
      return lo + rnd()*(hi-lo);
    }}
    return edges[0];
  };
}

    rsrc: D.shape.resource_count, rsrcAsg: D.shape.resource_assignment_count, codeTypes: D.shape.activity_code_type_count,
    start: D.time.start_date, finish: D.time.finish_date, dataDate: D.time.data_date,
    p6: DERIVED._p6_version || "8.3", rev: 23, revs: 23, forks: 3,
    pct: D.progress.pct_complete, statusMix: D.progress.status_mix,
    bytes: MEASURED.xer_bytes, gzip: MEASURED.xer_gzip,
    derivedBytes: MEASURED.derived_bytes, actsGz: MEASURED.activities_gzip
  };
  const rows = makeRows(meta.acts, wbs, meta, durS, flS, rnd, D.distributions.s_curve);
  return { ...meta, kind, wbs, rows, derived: D,
    sCurve: D.distributions.s_curve, floatHist: fl, durHist: D.distributions.duration_histogram,
    typeMix: D.distributions.activity_type_mix, relMix: D.logic.relationship_type_mix,
    openEnds: D.logic.open_ends, criticalCount: D.logic.critical_count, criticalThr: D.logic.critical_threshold_hr,
    longestPath: D.logic.longest_path, codes: D.codes.types, issues: D.issues,
    passed: D.quality.passed, applicable: D.quality.applicable, skipped: D.quality.skipped,
    fs: Math.round((D.logic.relationship_type_mix.PR_FS / D.shape.relationship_count) * 1000)/10,
    checks: D.quality.checks.map(c => ({ ...c, display: c.pct !== undefined ? c.pct + "%" : (c.count !== undefined ? fmtN(c.count) : "—") })),
    span: D.time.span_calendar_days
  };
}

/* 20,000 rows in WBS order. Finish months are drawn from the real monthly
   distribution the S-curve plots, so the table and the chart agree; float and
   duration are drawn from the real histograms. */
function makeRows(n, wbs, meta, durS, flS, rnd, curve) {
  const leaves = [];
  wbs.forEach(w => { for (let k = 0; k < w.n; k++) leaves.push(w); });
  while (leaves.length < n) leaves.push(wbs[0]);
  const t0 = Date.parse(meta.start + "T00:00Z");
  const [fy, fm] = curve.from.split("-").map(Number);
  const cum = curve.cumulative, months = cum.length;
  const done = meta.statusMix.TK_Complete || 0, active = meta.statusMix.TK_Active || 0;
  const rows = new Array(n);
  let m = 0;
  for (let i = 0; i < n; i++) {
    const w = leaves[i];
    while (m < months - 1 && cum[m] * n / (cum[months-1] || n) <= i) m++;
    const mm = fm - 1 + m;
    const finish = Date.UTC(fy + Math.floor(mm/12), ((mm%12)+12)%12, 1 + Math.floor(rnd()*28));
    const dur = Math.max(0, Math.round(durS()));
    const type = i % 37 === 0 ? "TT_FinMile" : i % 211 === 0 ? "TT_Mile" : "TT_Task";
    const start = Math.max(t0, finish - (type === "TT_Task" ? dur : 0) * 1.4 * DAY);
    const status = i < done ? "TK_Complete" : i < done + active ? "TK_Active" : "TK_NotStart";
    rows[i] = {
      code: "A" + String(1000 + i*10).padStart(6, "0"),
      name: ACT_NAMES[(i*7 + w.i) % ACT_NAMES.length] + (i % 3 === 0 ? " — " + w.name : ""),
      wbs: w.i, wcode: w.code,
      type, status,
      dur: type === "TT_Task" ? dur : 0,
      float: status === "TK_Complete" ? null : Math.round(flS()),
      start, finish
    };
  }
  return rows;
}

function fakeCurve(start, finish, n, rnd) {
  const a = new Date(start), b = new Date(finish);
  const months = (b.getUTCFullYear()-a.getUTCFullYear())*12 + (b.getUTCMonth()-a.getUTCMonth()) + 1;
  const finishes = [], starts = [];
  for (let i = 0; i < months; i++) {
    const x = i/(months-1), s = Math.exp(-Math.pow((x-0.55)/0.26, 2));
    finishes.push(Math.round(s * n / 9));
    starts.push(Math.round(Math.exp(-Math.pow((x-0.42)/0.26,2)) * n / 9));
  }
  const scale = n / finishes.reduce((s,v)=>s+v,0);
  const f = finishes.map(v => Math.round(v*scale));
  let run = 0;
  return { bucket: "month", from: start.slice(0,7), to: finish.slice(0,7),
           starts: starts.map(v=>Math.round(v*scale)), finishes: f, cumulative: f.map(v => run += v) };
}

/* ===========================================================================
   Charts — hand-rolled SVG, no library (ticket 010)
   =========================================================================== */
let UID = 0;
const TIPS = [];
function tipWrap(inner) { const id = "tip" + (++UID); TIPS.push(id); return { id, html: `<div class="tip" id="${id}"></div>` + inner }; }

/* S-curve: cumulative finishes over months. One series → no legend box. */
function sCurve(P, w, h, opts = {}) {
  const c = P.sCurve, pts = c.cumulative, n = pts.length;
  if (!n) return `<div class="mut">no dates</div>`;
  const L = opts.bare ? 2 : 44, R = 8, T = 14, B = opts.bare ? 2 : 22;
  const sc = niceScale(pts[n-1] || 1, 4);
  const iw = w - L - R, ih = h - T - B, max = sc.top;
  const X = i => L + (i/(n-1))*iw, Y = v => T + ih - (v/max)*ih;
  const line = pts.map((v,i) => `${i?"L":"M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  const [fy, fm] = c.from.split("-").map(Number);
  const monLabel = i => { const m = fm - 1 + i; return { y: fy + Math.floor(m/12), m: ((m%12)+12)%12 }; };
  const ddIdx = P.dataDate ? (() => {
    const d = new Date(P.dataDate.replace(" ","T") + "Z");
    return (d.getUTCFullYear()-fy)*12 + (d.getUTCMonth()-(fm-1)) + d.getUTCDate()/30;
  })() : null;
  const cut = ddIdx === null ? null : L + (ddIdx/(n-1))*iw;
  const clip = "cl" + (++UID);
  const ticks = [];
  for (let i = 0; i < n; i++) { const {y,m} = monLabel(i); if (m === 0) ticks.push([i,y]); }
  const yTicks = opts.bare ? [] : sc.ticks;
  const t = tipWrap(`
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" class="sc" data-n="${n}" data-l="${L}" data-iw="${iw}" data-max="${max}"
         role="img" aria-label="cumulative activities finished by month; ${P.pct}% complete at the data date">
      <defs><clipPath id="${clip}"><rect x="0" y="0" width="${(cut ?? 0).toFixed(1)}" height="${h}"/></clipPath></defs>
      ${yTicks.map(v => `<line x1="${L}" y1="${Y(v)}" x2="${w-R}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/>
        <text class="axlab" x="${L-6}" y="${Y(v)+3.5}" text-anchor="end">${axisFmt(v)}</text>`).join("")}
      <path d="${line}L${X(n-1)},${T+ih}L${X(0)},${T+ih}Z" fill="var(--series)" fill-opacity="0.10"/>
      <path d="${line}L${X(n-1)},${T+ih}L${X(0)},${T+ih}Z" fill="var(--series)" fill-opacity="0.22" clip-path="url(#${clip})"/>
      <path d="${line}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      ${cut !== null ? `<line x1="${cut.toFixed(1)}" y1="${T-6}" x2="${cut.toFixed(1)}" y2="${T+ih}" stroke="var(--ink)" stroke-width="2" vector-effect="non-scaling-stroke"/>
        <polygon points="${(cut-4).toFixed(1)},${T-6} ${(cut+4).toFixed(1)},${T-6} ${cut.toFixed(1)},${T}" fill="var(--ink)"/>` : ``}
      ${opts.bare ? `` : ticks.map(([i,y]) => `<text class="axlab" x="${X(i)}" y="${h-6}" text-anchor="middle">${y}</text>`).join("")}
      ${cut !== null && !opts.bare ? `<text class="axlab" x="${(cut + 7).toFixed(1)}" y="${T-7}" text-anchor="start" style="fill:var(--ink)">data date ${fmtD(P.dataDate.replace(" ","T")+"Z")}</text>` : ``}
      <line class="cross" x1="0" y1="${T}" x2="0" y2="${T+ih}" stroke="var(--axis)" stroke-width="1" opacity="0"/>
      <circle class="dot" r="4" fill="var(--series)" stroke="var(--surface)" stroke-width="2" opacity="0"/>
      <rect class="hit" x="${L}" y="0" width="${iw}" height="${h}" fill="transparent"/>
    </svg>`);
  return `<div class="chartbox" data-chart="scurve" data-tip="${t.id}"${src("derived")}>${t.html}</div>`;
}

const axisFmt = v => v >= 1000 ? (Math.round(v/100)/10).toString().replace(/\.0$/,"") + "k" : String(v);

/* Axis ticks land on round numbers, never on the data's own maximum. */
function niceScale(max, want = 2) {
  const raw = Math.max(1, max) / want;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = ([1, 2, 2.5, 5, 10].find(s => s * mag >= raw) || 10) * mag;
  const top = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = 0; v <= top + 1e-9; v += step) ticks.push(Math.round(v));
  return { top: top || 1, ticks };
}

/* Histogram: columns, ≤24px, 4px rounded cap, 2px surface gaps. */
function histogram(P, kind, w, h) {
  const H = kind === "float" ? P.floatHist : P.durHist;
  const counts = H.counts, n = counts.length;
  const sc = niceScale(Math.max(...counts, 1));
  const max = sc.top;
  const L = 40, R = 8, T = 10, B = 30, iw = w - L - R, ih = h - T - B;
  const band = iw / n, bw = Math.min(24, band - 4);
  const labels = kind === "float"
    ? ["<-20", "-20–0", "0–5", "5–10", "10–20", "20–44", "44–100", "100–200", "200+"]
    : ["<1", "1–5", "5–10", "10–20", "20–44", "44–100", "100–200", "200+"];
  const band3 = i => kind !== "float" ? "var(--series)" : (i <= 1 ? "var(--neg)" : i <= 5 ? "var(--series)" : "var(--slack)");
  const yTicks = sc.ticks;
  const peakCount = Math.max(...counts);
  const bars = counts.map((c,i) => {
    const bh = (c/max)*ih, x = L + band*i + (band-bw)/2, y = T + ih - bh;
    if (bh < 0.6) return `<rect x="${x.toFixed(1)}" y="${(T+ih-1).toFixed(1)}" width="${bw.toFixed(1)}" height="1" fill="${band3(i)}" opacity=".35" data-i="${i}"/>`;
    const r = Math.min(4, bh);
    return `<path d="M${x.toFixed(1)},${(y+bh).toFixed(1)} L${x.toFixed(1)},${(y+r).toFixed(1)} Q${x.toFixed(1)},${y.toFixed(1)} ${(x+r).toFixed(1)},${y.toFixed(1)} L${(x+bw-r).toFixed(1)},${y.toFixed(1)} Q${(x+bw).toFixed(1)},${y.toFixed(1)} ${(x+bw).toFixed(1)},${(y+r).toFixed(1)} L${(x+bw).toFixed(1)},${(y+bh).toFixed(1)} Z" fill="${band3(i)}" data-i="${i}"/>`;
  }).join("");
  const peak = counts.indexOf(peakCount);
  const t = tipWrap(`
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img"
         aria-label="${kind === "float" ? "total float" : "original duration"} distribution, ${n} fixed buckets">
      ${yTicks.map(v => `<line x1="${L}" y1="${T+ih-(v/max)*ih}" x2="${w-R}" y2="${T+ih-(v/max)*ih}" stroke="var(--grid)" stroke-width="1"/>
        <text class="axlab" x="${L-6}" y="${T+ih-(v/max)*ih+3.5}" text-anchor="end">${axisFmt(v)}</text>`).join("")}
      ${bars}
      <text class="axlab" x="${L + band*peak + band/2}" y="${T + ih - (peakCount/max)*ih - 4}" text-anchor="middle" style="fill:var(--ink-2)">${fmtN(peakCount)}</text>
      ${labels.map((l,i) => (band < 42 && i % 2) ? `` :
        `<text class="axlab" x="${L + band*i + band/2}" y="${h-14}" text-anchor="middle">${l}</text>`).join("")}
      <text class="axlab" x="${L + iw/2}" y="${h-2}" text-anchor="middle">${kind === "float" ? "total float, days" : "original duration, days"}</text>
      ${counts.map((c,i) => `<rect x="${L+band*i}" y="${T}" width="${band}" height="${ih}" fill="transparent" data-i="${i}"/>`).join("")}
    </svg>`);
  return `<div class="chartbox" data-chart="hist" data-kind="${kind}" data-tip="${t.id}"${src("derived")}>${t.html}</div>`;
}

/* Float has three forms in this prototype, switched from the bottom bar, because
   the histogram the contract stores turns out not to be the thing to draw. */
const FLOAT_BUCKETS = ["under −20d", "−20 to 0d", "0–5d", "5–10d", "10–20d", "20–44d", "44–100d", "100–200d", "over 200d"];
function floatSplit(P) {
  const c = P.floatHist.counts;
  const neg = c[0] + c[1], ok = c[2] + c[3] + c[4] + c[5], high = c[6] + c[7] + c[8];
  return { neg, ok, high, tot: neg + ok + high || 1 };
}
function floatTable(P) {
  const c = P.floatHist.counts, tot = c.reduce((a,b) => a+b, 0) || 1;
  const half = Math.ceil(c.length / 2);
  const colOf = (from, to) => `<table style="width:100%;border-collapse:collapse;font-size:11.5px">` +
    c.slice(from, to).map((v, j) => {
      const i = from + j, band = i <= 1 ? "var(--neg)" : i <= 5 ? "var(--series)" : "var(--slack)";
      return `<tr><td style="padding:2px 0"><i style="display:inline-block;width:7px;height:7px;border-radius:2px;background:${band};margin-right:6px"></i>${FLOAT_BUCKETS[i]}</td>
        <td class="num" style="text-align:right;padding:2px 0">${fmtN(v)}</td>
        <td class="num mut" style="text-align:right;width:44px">${(v/tot*100).toFixed(1)}%</td></tr>`;
    }).join("") + `</table>`;
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px"${src("derived")}>
    ${colOf(0, half)}${colOf(half, c.length)}</div>`;
}
function floatPanel(P, w, h) {
  const { neg, ok, high, tot } = floatSplit(P);
  const pc = v => (v / tot * 100).toFixed(1);
  const key = `<div class="bandkey">
    <span><i style="background:var(--neg)"></i>negative — behind <b class="num">${fmtN(neg)}</b> | ${pc(neg)}%</span>
    <span><i style="background:var(--series)"></i>0–44 days <b class="num">${fmtN(ok)}</b> | ${pc(ok)}%</span>
    <span><i style="background:var(--slack)"></i>over 44 days <b class="num">${fmtN(high)}</b> | ${pc(high)}%</span></div>`;
  if (ST.floatForm === "hist") return histogram(P, "float", w, h) + key;
  if (ST.floatForm === "table") return key + floatTable(P);
  const seg = (v, col, lab) => v <= 0 ? "" :
    `<div title="${lab}: ${fmtN(v)}" style="flex:${v} 0 0;background:${col};border-radius:3px"></div>`;
  return `<div${src("derived")}>
    <div style="display:flex;gap:2px;height:32px;margin:14px 0 2px">
      ${seg(neg, "var(--neg)", "negative float")}${seg(ok, "var(--series)", "0–44 days")}${seg(high, "var(--slack)", "over 44 days")}</div>
    ${key}${floatTable(P)}</div>`;
}

/* Status: an ordered scale → one hue, three steps, direct-labelled. */
function statusBar(P, h = 26) {
  const m = P.statusMix, tot = P.acts;
  const seg = [["Complete", m.TK_Complete||0, "var(--series-700)"], ["In progress", m.TK_Active||0, "var(--series)"], ["Not started", m.TK_NotStart||0, "var(--series-100)"]];
  return `<div${src("derived")}>
    <div style="display:flex;gap:2px;height:${h}px">
      ${seg.filter(s=>s[1]).map(([l,v,c]) => `<div title="${l}: ${fmtN(v)}" style="flex:${v} 0 0;background:${c};border-radius:3px"></div>`).join("")}
    </div>
    <div class="bandkey">${seg.map(([l,v,c]) => `<span><i style="background:${c}"></i>${l} <b class="num">${fmtN(v)}</b></span>`).join("")}</div></div>`;
}

/* A single ratio against a limit → meter, same-ramp track. */
function meter(label, pct, threshold, ok, note) {
  return `<div${src("derived")} style="margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;font-size:12.5px"><span class="ink2">${label}</span>
      <span class="num" style="font-weight:600">${pct}%</span></div>
    <div style="position:relative;height:8px;background:var(--series-100);border-radius:4px;margin-top:5px">
      <div style="position:absolute;inset:0 auto 0 0;width:${Math.min(100,pct)}%;background:${ok?"var(--series)":"var(--neg)"};border-radius:4px"></div>
      <div style="position:absolute;top:-3px;bottom:-3px;left:${threshold}%;width:2px;background:var(--ink)"></div>
    </div>
    <div class="mut" style="font-size:11px;margin-top:4px">${note}</div></div>`;
}

/* ===========================================================================
   DCMA
   =========================================================================== */
function dcmaStrip(P, bare) {
  let cells = "";
  for (let i = 0; i < 14; i++) {
    const c = P.checks[i];
    cells += `<span class="cell ${c.state === "skip" ? "skip" : c.state}"></span>`;
  }
  return `<span class="cells" title="${P.passed} of ${P.applicable} applicable DCMA checks passed">${cells}</span>`
    + (bare ? `` : `<b class="num" style="margin-left:7px">${P.passed}/${P.applicable}</b>`);
}
/* which population each check's percentage is out of. a scorecard that prints
   "35.6%" without saying of what is unreadable, and the two populations differ
   by 14,000 here. */
const CHECK_BASE = {
  logic: "acts", leads: "rels", lags: "rels", relationship_types: "rels",
  hard_constraints: "acts", high_float: "acts", negative_float: "acts",
  high_duration: "acts", invalid_dates: "acts", resources: "acts"
};
const CHECK_UNIT = { acts: "activities", rels: "relationships" };
/* "<=5%" | ">=90%" | "0" — the three shapes DCMA 1–10 use */
function parseThr(t) {
  if (!t) return null;
  if (t === "0") return { kind: "zero" };
  const m = /^(<=|>=)\s*([\d.]+)%$/.exec(t);
  return m ? { kind: m[1] === "<=" ? "max" : "min", limit: +m[2] } : null;
}
function chkCount(c) {
  if (c.count !== undefined) return c.count;
  if (c.no_predecessor !== undefined) return c.no_predecessor + c.no_successor;
  return undefined;
}
/* the bar and the sentence say the same thing. the sentence is the one that
   survives being printed in greyscale or read by someone with deuteranopia. */
function chkMeter(P, c) {
  const t = parseThr(c.threshold);
  if (!t || c.pct === undefined) return "";
  const pass = c.state === "pass";
  if (t.kind === "zero") return "";
  const scale = Math.max(c.pct, t.limit) * 1.28 || 1;
  const w = Math.min(100, (c.pct / scale) * 100);
  const tx = Math.min(100, (t.limit / scale) * 100);
  let margin;
  if (t.kind === "max") {
    margin = pass
      ? `<b>${(t.limit - c.pct).toFixed(1)} points</b> under the ${t.limit}% limit`
      : `<b>${(c.pct / t.limit).toFixed(1)}×</b> the ${t.limit}% limit`;
  } else {
    margin = pass
      ? `<b>${(c.pct - t.limit).toFixed(1)} points</b> over the ${t.limit}% floor`
      : `<b>${(t.limit - c.pct).toFixed(1)} points</b> short of the ${t.limit}% floor`;
  }
  return `<div class="chkbar"><div class="track">
      <div class="fill ${c.state}" style="width:${w.toFixed(1)}%"></div>
      <div class="tick" style="left:${tx.toFixed(1)}%"><i>${t.limit}%</i></div>
    </div><div class="margin">${margin}</div></div>`;
}
function dcmaChecks(P, open) {
  return `<div class="checks"${src("derived")}>` + P.checks.map(c => {
    const skip = c.state === "skip";
    const mark = skip ? "–" : c.state === "pass" ? "✓" : "✕";
    const isOpen = open === c.id && (c.examples || []).length;
    const n = chkCount(c), base = CHECK_BASE[c.id], pop = base === "rels" ? P.rels : P.acts;
    /* value cell: the number the threshold is about, then the count it came
       from and the population it came out of */
    let val = `<span class="mut">—</span>`, sub = "";
    if (!skip) {
      val = `<b>${c.display}</b>`;
      if (c.pct !== undefined && n !== undefined) sub = `${fmtN(n)} of ${fmtN(pop)} ${CHECK_UNIT[base]}`;
      else if (c.pct !== undefined) sub = `of ${fmtN(pop)} ${CHECK_UNIT[base]}`;
      else if (n !== undefined) sub = `of ${fmtN(pop)} ${CHECK_UNIT[base]}`;
    }
    const zero = parseThr(c.threshold)?.kind === "zero" && !skip;
    const zeroLine = zero
      ? `<div class="chkbar" style="grid-template-columns:1fr"><div class="margin">${
          c.state === "pass" ? `<b>none</b>, which is what the standard allows`
                             : `<b>${fmtN(n ?? 0)}</b> where the standard allows none`}</div></div>`
      : "";
    return `<div class="chk ${skip?"skipped":""}" data-check="${c.id}">
        <span class="mark ${c.state}" aria-hidden="true">${mark}</span>
        <span class="n num">${c.num}</span>
        <span><span>${CHECK_LABEL[c.id]}</span> <span class="state">${skip ? "not applicable" : c.state}</span>
          <div class="mut" style="font-size:11px">${skip ? (c.reason || "no baseline in file") : CHECK_WHY[c.id]}</div>
          ${skip ? "" : chkMeter(P, c) + zeroLine}</span>
        <span class="val">${val}${sub ? `<small>${sub}</small>` : ""}</span>
        <span class="thr">${c.threshold ? "target " + c.threshold : `<span class="mut">no limit</span>`}</span>
        <span class="caret">${(c.examples||[]).length ? (isOpen ? "▾" : "▸") : ""}</span>
      </div>` + (isOpen ? exemplars(c) : "");
  }).join("") + `</div>`;
}
function exemplars(c) {
  const rows = (c.examples || []).slice(0, 50);
  const pair = c.id === "leads";
  const vlab = c.id === "leads" ? "lag" : c.id === "high_duration" ? "duration" : "float";
  return `<div class="exemplars"${src("derived")}>
    <div class="scroll"><table>
      <thead><tr><td style="width:82px">${pair ? "predecessor" : "code"}</td>
        <td>${pair ? "successor" : "activity"}</td><td class="v">${vlab}</td></tr></thead>
      ${rows.map(e => `<tr><td class="num" style="width:82px">${esc(e.code || e.pred || "")}</td>
      <td>${esc(e.name || ("→ " + (e.succ || "")))}</td>
      <td class="v">${(e.value_hr/HR).toFixed(e.value_hr % HR ? 1 : 0)}d</td></tr>`).join("")}</table></div>
    <div class="more">Showing ${rows.length} of ${fmtN(c.count ?? rows.length)}${c.truncated ? " — derived.json caps exemplars at 50" : ""}.
      <a href="#">Open all ${fmtN(c.count ?? rows.length)} in the activity table →</a></div></div>`;
}

/* ===========================================================================
   WBS tree
   =========================================================================== */
const TS = { open: new Set([0]), sel: null };
function wbsTree(P) {
  if (P.wbs.length === 1) {
    return `<div class="pad" style="font-size:12.5px"${src("acts")}>
      <b>No work breakdown structure.</b>
      <div class="mut" style="margin-top:4px">All ${fmtN(P.acts)} activities sit under a single node. This is a real
      shape, not a parse failure — a tender programme often carries none.</div>
      <div class="mut" style="margin-top:8px">Group the table by <b>activity code</b> instead:</div>
      <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">
        ${P.codes.map(c => `<button class="pill">${esc(c.name)}</button>`).join("")}</div></div>`;
  }
  const out = [];
  const walk = (node, depth) => {
    const open = TS.open.has(node.i), kids = node.kids.length;
    out.push(`<div class="tnode ${TS.sel === node.i ? "on" : ""}" data-wbs="${node.i}" style="padding-left:${6 + depth*13}px">
      <span class="tw" data-tog="${node.i}">${kids ? (open ? "▾" : "▸") : ""}</span>
      <span class="tn" title="${esc(node.code)} ${esc(node.name)}">${esc(node.name)}</span>
      <span class="tc">${fmtN(node.total)}</span></div>`);
    if (open) node.kids.forEach(k => walk(k, depth+1));
  };
  walk(P.wbs[0], 0);
  return `<div class="tree"${src("acts")}>${out.join("")}</div>`;
}

/* ===========================================================================
   Virtualised activity table — 20,000 rows
   =========================================================================== */
const TBL = { sort: "code", dir: 1, q: "", status: "all", crit: false, view: [], rowH: 28 };
const COLS = [
  ["code", "Activity ID", ""], ["name", "Activity name", ""], ["wcode", "WBS", ""],
  ["status", "Status", ""], ["dur", "Dur", "r"], ["float", "Total float", "r"],
  ["start", "Start", "r"], ["finish", "Finish", "r"]
];
function tableFilter(P) {
  const q = TBL.q.toLowerCase();
  let v = P.rows;
  if (TS.sel !== null && P.wbs.length > 1) {
    const keep = new Set(); const mark = n => { keep.add(n.i); n.kids.forEach(mark); };
    mark(P.wbs[TS.sel]);
    v = v.filter(a => keep.has(a.wbs));
  }
  if (TBL.status !== "all") v = v.filter(a => a.status === TBL.status);
  if (TBL.crit) v = v.filter(a => a.float !== null && a.float <= 0);
  if (q) v = v.filter(a => a.name.toLowerCase().includes(q) || a.code.toLowerCase().includes(q));
  const k = TBL.sort, d = TBL.dir;
  v = v.slice().sort((a,b) => {
    let x = a[k], y = b[k];
    if (x === null) return 1; if (y === null) return -1;
    return (x < y ? -1 : x > y ? 1 : 0) * d;
  });
  TBL.view = v;
  return v;
}
function tableToolbar(P) {
  const sel = TS.sel !== null && P.wbs.length > 1 ? P.wbs[TS.sel] : null;
  return `<div class="tbar">
    <input type="search" id="q" placeholder="Search ${fmtN(P.acts)} activities" value="${esc(TBL.q)}">
    <button class="pill ${TBL.status==="all"?"on":""}" data-st="all">All</button>
    <button class="pill ${TBL.status==="TK_NotStart"?"on":""}" data-st="TK_NotStart">Not started</button>
    <button class="pill ${TBL.status==="TK_Active"?"on":""}" data-st="TK_Active">In progress</button>
    <button class="pill ${TBL.status==="TK_Complete"?"on":""}" data-st="TK_Complete">Complete</button>
    <button class="pill ${TBL.crit?"on":""}" data-crit="1">Float ≤ 0</button>
    ${sel ? `<button class="pill on" data-clear="1">${esc(sel.code)} ${esc(sel.name)} ✕</button>` : ``}
    <span class="spacer"></span>
    <span class="stat" id="tstat"></span></div>`;
}
function tableHead() {
  return `<div class="grid-head">${COLS.map(([k,l,a]) =>
    `<span class="${a}" data-sort="${k}">${l}${TBL.sort===k ? (TBL.dir>0?" ▲":" ▼") : ""}</span>`).join("")}</div>`;
}
function tableViewport(h) {
  return `<div class="vp" id="vp" style="${h ? `height:${h}px` : "flex:1"}"${src("acts")}>
    <div class="spacerv" id="spacerv"><div class="vwin" id="vwin"></div></div></div>`;
}
function renderWindow() {
  const vp = document.getElementById("vp"); if (!vp) return;
  const v = TBL.view, top = vp.scrollTop, h = vp.clientHeight;
  const first = Math.max(0, Math.floor(top / TBL.rowH) - 6);
  const last = Math.min(v.length, Math.ceil((top + h) / TBL.rowH) + 6);
  const win = document.getElementById("vwin");
  win.style.transform = `translateY(${first * TBL.rowH}px)`;
  let html = "";
  for (let i = first; i < last; i++) {
    const a = v[i];
    const fl = a.float === null ? `<span class="em">—</span>`
      : `<span class="${a.float < 0 ? "neg" : a.float > 44 ? "hi" : ""}">${a.float}d</span>`;
    html += `<div class="grid-row">
      <span>${a.code}</span>
      <span class="nm">${a.type !== "TT_Task" ? `<span class="mile" title="milestone">◆ </span>` : ""}${esc(a.name)}</span>
      <span class="wb">${a.wcode}</span>
      <span class="st ${a.status==="TK_Complete"?"c":a.status==="TK_Active"?"a":"n"}"><i></i>${a.status==="TK_Complete"?"Done":a.status==="TK_Active"?"Active":"—"}</span>
      <span class="r">${a.type === "TT_Task" ? a.dur + "d" : `<span class="em">—</span>`}</span>
      <span class="r">${fl}</span>
      <span class="r">${fmtD(a.start)}</span>
      <span class="r">${fmtD(a.finish)}</span></div>`;
  }
  win.innerHTML = html;
  document.getElementById("spacerv").style.height = (v.length * TBL.rowH) + "px";
  const st = document.getElementById("tstat");
  if (st) st.textContent = `${fmtN(v.length)} row${v.length===1?"":"s"}` + (v.length < P.acts ? ` of ${fmtN(P.acts)}` : "");
}

        ? `<span>root — nothing was forked to make it</span>`
        : `<span>forked from <a href="#">Depot resignalling</a> at <b>r4</b>, by <a href="#">northline</a></span>`}
      <span class="dot">|</span><a href="#">${P.revs} revision${P.revs===1?"":"s"}</a>

function actions(P, sm) {

function revSelect(P) {

function facts(P) {

  const tile = (lab, val, sub, s) => `<div class="tile"${src(s||"col")}><div class="lab">${lab}</div>
    <div class="val">${val}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;

  t.push(tile("Window", `${new Date(P.start).getUTCFullYear()}–${new Date(P.finish).getUTCFullYear()}`, `${fmtN(P.span)} days`));
  t.push(tile("Relationships", fmtN(P.rels), `${P.fs}% finish-to-start`, "derived"));
  t.push(tile("WBS", P.wbsDepth === 1 ? "none" : fmtN(P.wbsNodes), P.wbsDepth === 1 ? "single node" : `${P.wbsDepth} levels deep`, "derived"));
  t.push(tile("Resources", fmtN(P.rsrc), `${fmtN(P.rsrcAsg)} assignments`, "derived"));

      <div class="sub">by month | the rule marks the data date</div>${sCurve(P, 1280, 200)}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px">
      <div class="card pad chartbox"><div class="ttl">Total float</div><div class="sub">fixed buckets, days</div>
        ${floatPanel(P, 620, 190)}
        ${floatNullCallout(P)}</div>
      <div class="card pad chartbox"><div class="ttl">Original duration</div><div class="sub">fixed buckets, days</div>
        ${histogram(P, "dur", 620, 190)}<div style="margin-top:14px">${statusBar(P)}</div></div>
    </div>
    ${criticalCallout(P)}
    <div class="tabnote">Everything on this tab came from ${fetchNote(P, "derived")}. No blob read.</div>`;
  if (tab === "quality") body = `
    <div class="card" style="margin-top:4px">
      <div class="pad" style="display:flex;gap:22px;align-items:center;border-bottom:1px solid var(--hair)">
        <div><div class="hero">${P.passed}<small>/${P.applicable}</small></div>
          <div class="mut" style="font-size:11.5px">checks passed</div></div>
        <div style="flex:1">${meter("Finish-to-start relationships", P.fs, 90, P.fs >= 90, "DCMA 4 wants 90% or more")}</div>
      </div>${dcmaChecks(P, ST.check)}</div>
    <div class="tabnote">Exemplars are the 50 worst per check, capped inside derived.json. "Open all" is the one
      link on this tab that costs a blob read.</div>`;
  if (tab === "activities") body = `
    <div class="card" style="margin-top:12px;overflow:hidden">${tableToolbar(P)}${tableHead()}${tableViewport(560)}</div>
    <div class="tabnote">This tab is the only one that reads ${fetchNote(P, "acts")} — a visitor who never opens it
      never pays for it.</div>`;
  if (tab === "structure") body = `
    <div style="display:grid;grid-template-columns:1fr 420px;gap:16px;margin-top:12px;align-items:start">
      <div class="card" style="max-height:600px;overflow:auto">${wbsTree(P)}</div>
      <div><div class="card pad"><div class="ttl" style="margin-bottom:8px">Activity codes</div>${codesPanel(P)}</div>
        <div class="card pad" style="margin-top:16px"><div class="ttl" style="margin-bottom:10px">Status</div>${statusBar(P)}</div></div>
    </div>`;
  if (tab === "revisions") body = `
    <h2 class="sec" style="margin-top:18px">Forks — the family this programme belongs to</h2>
    <div class="card">
      ${[[P.title, P.handle, P.kind === "tender" ? "root" : "forked from Depot resignalling r4"],
         [P.title + " — Option 3", "gridworks", "forked from r4"],
         [P.title + " — alt logic", "cpm_kate", "forked from r11"]].map(([t,h,rel],i) => `
        <div style="display:grid;grid-template-columns:1fr 130px 150px;gap:12px;padding:11px 14px;border-top:${i?"1px solid var(--hair)":"0"};font-size:13px">
          <span>${i===0?"<b>":""}${esc(t)}${i===0?"</b> — you are here":""}</span>
          <span class="mut">${esc(h)}</span><span class="mut">${rel}</span></div>`).join("")}
    </div>
    <h2 class="sec">Revisions of this programme</h2>
    <div class="card">
      ${Array.from({length: Math.min(P.revs, 8)}, (_,i) => {
        const r = P.revs - i;
        return `<div style="display:grid;grid-template-columns:52px 1fr 120px 100px 130px;gap:12px;padding:11px 14px;border-top:${i?"1px solid var(--hair)":"0"};align-items:center;font-size:13px">
          <b class="num">r${r}</b>
          <span>${i === 0 ? "Current — monthly update, data date moved forward" : "Monthly update"}</span>
          <span class="num mut">${fmtN(P.acts - i*40)} activities</span>
          <span class="num mut">${Math.max(0, P.pct - i*4).toFixed(1)}%</span>
          <span class="mut">${i === 0 ? "3mo ago" : (i+3) + "mo ago"}</span></div>`;
      }).join("")}
    </div>
    <div class="tabnote">Each revision is its own row and its own blobs. <b>Compare…</b> is deliberately not built —
      this tab is the seam a future diff view mounts into, and it exists so adding one is not a rebuild.</div>`;
  return `<div class="wrap">
    <div class="idrow" style="margin-bottom:6px">${identity(P)}
      <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">${actions(P)}${revSelect(P)}</div></div>
    <div class="tabs">${TABS.map(([k,l]) => `<button class="tab ${tab===k?"on":""}" data-tab="${k}">${l}${counts[k]?`<span class="c">${counts[k]}</span>`:""}</button>`).join("")}</div>
    ${body}<div style="height:50px"></div></div>`;
}

/* ===========================================================================
   Router + prototype chrome
   =========================================================================== */
const VARIANTS = { A: ["Dossier — one scrolling document", VariantA],
                   B: ["Workbench — the table is the page", VariantB],
                   C: ["Verdict — quality first, programme as evidence", VariantC],
                   D: ["Tabbed — a surface and a fetch per tab", VariantD] };
const ST = { variant: "A", p: "20k", fields: false, check: null, tab: "overview", drawer: true, theme: null, floatForm: "bands" };
let P = null;

function readParams() {
  const u = new URL(location.href), g = k => u.searchParams.get(k);
  ST.variant = (g("variant") || "A").toUpperCase();
  if (!VARIANTS[ST.variant]) ST.variant = "A";
  ST.p = g("p") === "tender" ? "tender" : "20k";
  ST.fields = g("fields") === "1";
  ST.theme = g("theme");
  ST.floatForm = ["bands","hist","table"].includes(g("float")) ? g("float") : "bands";
  if (g("tab")) ST.tab = g("tab");
}
function setParam(k, v) {
  const u = new URL(location.href);
  if (v === null) u.searchParams.delete(k); else u.searchParams.set(k, v);
  history.replaceState(null, "", u);
  readParams(); render();
}

function render(keepTable) {
  if (!keepTable) { P = buildProgramme(ST.p); }
  document.body.classList.toggle("fields", ST.fields);
  document.body.classList.toggle("scrolls", ST.variant !== "B");
  if (ST.theme) document.documentElement.setAttribute("data-theme", ST.theme);
  else document.documentElement.removeAttribute("data-theme");
  TIPS.length = 0;
  tableFilter(P);
  document.getElementById("root").innerHTML =
    (ST.fields ? `<div class="wrap"><div class="legend-src">
      <span><i style="border-color:var(--series)"></i>Postgres row — free, already loaded by the shelf</span>
      <span><i style="border-color:var(--slack)"></i><code>derived.json</code> — one ${fmtBytes(P.derivedBytes)} blob read</span>
      <span><i style="border-color:var(--neg)"></i><code>activities.json</code> — ${fmtBytes(P.actsGz)} gzipped</span>
      <span><i style="border-color:var(--good)"></i>server query</span></div></div>` : "")
    + VARIANTS[ST.variant][1](P);
  wire();
  renderSwitcher();
  renderWindow();
}

function wire() {
  const vp = document.getElementById("vp");
  if (vp) vp.onscroll = renderWindow;
  document.querySelectorAll("[data-sort]").forEach(el => el.onclick = () => {
    const k = el.dataset.sort;
    if (TBL.sort === k) TBL.dir *= -1; else { TBL.sort = k; TBL.dir = 1; }
    tableFilter(P); refreshTable();
  });
  const q = document.getElementById("q");
  if (q) { q.oninput = () => { TBL.q = q.value; tableFilter(P); refreshTable(); document.getElementById("vp").scrollTop = 0; }; }
  document.querySelectorAll("[data-st]").forEach(el => el.onclick = () => { TBL.status = el.dataset.st; render(true); });
  document.querySelectorAll("[data-crit]").forEach(el => el.onclick = () => { TBL.crit = !TBL.crit; render(true); });
  document.querySelectorAll("[data-clear]").forEach(el => el.onclick = () => { TS.sel = null; render(true); });
  document.querySelectorAll("[data-tog]").forEach(el => el.onclick = e => {
    e.stopPropagation();
    const i = +el.dataset.tog; TS.open.has(i) ? TS.open.delete(i) : TS.open.add(i); render(true);
  });
  document.querySelectorAll("[data-wbs]").forEach(el => el.onclick = () => {
    const i = +el.dataset.wbs;
    TS.sel = TS.sel === i ? null : i;
    if (!TS.open.has(i)) TS.open.add(i);
    render(true);
  });
  document.querySelectorAll("[data-check]").forEach(el => el.onclick = () => {
    const id = el.dataset.check;
    ST.check = ST.check === id ? null : id; render(true);
  });
  document.querySelectorAll("[data-tab]").forEach(el => el.onclick = () => { ST.tab = el.dataset.tab; setParam("tab", ST.tab); });
  const dt = document.getElementById("drawerToggle");
  if (dt) dt.onclick = () => { ST.drawer = !ST.drawer; render(true); };
  wireCharts();
}
function refreshTable() {
  document.querySelectorAll("[data-sort]").forEach(el => {
    const k = el.dataset.sort;
    el.textContent = COLS.find(c => c[0] === k)[1] + (TBL.sort === k ? (TBL.dir > 0 ? " ▲" : " ▼") : "");
  });
  renderWindow();
}

function wireCharts() {
  document.querySelectorAll('[data-chart="scurve"]').forEach(box => {
    const svg = box.querySelector("svg"), tip = box.querySelector(".tip");
    const hit = svg.querySelector(".hit"), cross = svg.querySelector(".cross"), dot = svg.querySelector(".dot");
    if (!hit) return;
    const n = +svg.dataset.n, L = +svg.dataset.l, iw = +svg.dataset.iw, max = +svg.dataset.max;
    const c = P.sCurve, [fy, fm] = c.from.split("-").map(Number);
    hit.onmousemove = e => {
      const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
      const x = ((e.clientX - r.left) / r.width) * vb.width;
      const i = Math.max(0, Math.min(n-1, Math.round(((x - L) / iw) * (n-1))));
      const mm = fm - 1 + i, y = fy + Math.floor(mm/12), m = ((mm%12)+12)%12;
      const px = L + (i/(n-1))*iw, py = 8 + (vb.height - 8 - (svg.classList.contains("bare") ? 2 : 22)) * (1 - c.cumulative[i]/max);
      cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("opacity", ".9");
      dot.setAttribute("cx", px); dot.setAttribute("cy", py); dot.setAttribute("opacity", "1");
      tip.className = "tip on";
      tip.style.left = ((px / vb.width) * 100) + "%";
      tip.style.top = ((py / vb.height) * r.height) + "px";
      tip.innerHTML = `<b>${MON[m]} ${y}</b> &nbsp;<span class="k">finished</span> ${fmtN(c.cumulative[i])}
        &nbsp;<span class="k">this month</span> ${fmtN(c.finishes[i])} &nbsp;<span class="k">started</span> ${fmtN(c.starts[i])}`;
    };
    hit.onmouseleave = () => { tip.className = "tip"; cross.setAttribute("opacity","0"); dot.setAttribute("opacity","0"); };
  });
  document.querySelectorAll('[data-chart="hist"]').forEach(box => {
    const svg = box.querySelector("svg"), tip = box.querySelector(".tip");
    const kind = box.dataset.kind, H = kind === "float" ? P.floatHist : P.durHist;
    const labels = kind === "float"
      ? ["under −20 days","−20 to 0 days","0 to 5 days","5 to 10 days","10 to 20 days","20 to 44 days","44 to 100 days","100 to 200 days","over 200 days"]
      : ["under 1 day","1 to 5 days","5 to 10 days","10 to 20 days","20 to 44 days","44 to 100 days","100 to 200 days","over 200 days"];
    svg.querySelectorAll("[data-i]").forEach(el => {
      el.onmousemove = e => {
        const i = +el.dataset.i, r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
        tip.className = "tip on";
        tip.style.left = (((e.clientX - r.left) / r.width) * 100) + "%";
        tip.style.top = (r.height * 0.42) + "px";
        const pct = ((H.counts[i] / H.counts.reduce((a,b)=>a+b,0)) * 100).toFixed(1);
        tip.innerHTML = `<b>${labels[i]}</b> &nbsp;${fmtN(H.counts[i])} <span class="k">activities | ${pct}%</span>`;
      };
      el.onmouseleave = () => { tip.className = "tip"; };
    });
  });
}

function renderSwitcher() {
  const keys = Object.keys(VARIANTS);
  document.getElementById("switcher").innerHTML = `
    <button data-nav="-1">←</button>
    <span class="lab">${ST.variant} — ${VARIANTS[ST.variant][0]}</span>
    <button data-nav="1">→</button>
    <span class="sep"></span>
    <button data-p="20k" class="${ST.p==="20k"?"on":""}">20k progressed</button>
    <button data-p="tender" class="${ST.p==="tender"?"on":""}">3.3k tender</button>
    <span class="sep"></span>
    <span class="lab" style="font-weight:400;opacity:.65;padding-right:2px">float</span>
    ${["bands","hist","table"].map(f => `<button data-float="${f}" class="${ST.floatForm===f?"on":""}">${f}</button>`).join("")}
    <span class="sep"></span>
    <button data-f="${ST.fields?0:1}" class="${ST.fields?"on":""}">fields</button>
    <button data-t="1">${document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"}</button>`;
  document.querySelectorAll("#switcher [data-nav]").forEach(b => b.onclick = () => {
    const i = keys.indexOf(ST.variant), k = keys[(i + +b.dataset.nav + keys.length) % keys.length];
    setParam("variant", k);
  });
  document.querySelectorAll("#switcher [data-p]").forEach(b => b.onclick = () => { TS.sel = null; TBL.q = ""; setParam("p", b.dataset.p); });
  document.querySelectorAll("#switcher [data-float]").forEach(b => b.onclick = () => setParam("float", b.dataset.float));
  document.querySelector("#switcher [data-f]").onclick = e => setParam("fields", e.currentTarget.dataset.f);
  document.querySelector("#switcher [data-t]").onclick = () =>
    setParam("theme", document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
}

addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const keys = Object.keys(VARIANTS), i = keys.indexOf(ST.variant);
  setParam("variant", keys[(i + (e.key === "ArrowRight" ? 1 : -1) + keys.length) % keys.length]);
});

readParams();
render();
</script>
